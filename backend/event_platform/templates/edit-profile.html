<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Forguild</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Auth Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top border-bottom">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="dashboard.html">
                <i class="bi bi-hexagon-fill text-violet me-2"></i>Event<span>Hub</span>
            </a>

            <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                <li class="nav-item">
                    <a class="nav-link text-dark fw-bold" href="profile.html">Cancel</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main Layout -->
    <div class="container py-5 flex-grow-1" style="max-width: 800px;">
        <h2 class="fw-bold mb-4">Edit Profile</h2>

        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body p-4 p-md-5">
                <form
                    onsubmit="event.preventDefault(); alert('Profile Updated Successfully!'); window.location.href='profile.html';">

                    <div class="text-center mb-4">
                        <img src="https://ui-avatars.com/api/?name=John+Doe&background=8A2BE2&color=fff"
                            class="rounded-circle mb-3" width="100" height="100">
                        <div>
                            <button type="button" class="btn btn-sm btn-outline-primary rounded-pill">Change
                                Photo</button>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">First Name</label>
                            <input type="text" class="form-control" value="John" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Last Name</label>
                            <input type="text" class="form-control" value="Doe" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Headline</label>
                        <input type="text" class="form-control" value="Full Stack Developer"
                            placeholder="What do you do?">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Bio</label>
                        <textarea class="form-control"
                            rows="4">I'm a passionate full-stack developer who loves building products from 0 to 1.</textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Top Skills (Comma Separated)</label>
                        <input type="text" class="form-control" value="React, Python, Node.js"
                            placeholder="e.g. React, UI/UX, Django">
                    </div>

                    <h5 class="fw-bold mb-3 border-bottom pb-2 mt-5">Social Links</h5>

                    <div class="mb-3">
                        <label class="form-label text-muted">GitHub URL</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-github"></i></span>
                            <input type="url" class="form-control" value="https://github.com/johndoe">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted">LinkedIn URL</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-linkedin"></i></span>
                            <input type="url" class="form-control" value="https://linkedin.com/in/johndoe">
                        </div>
                    </div>

                    <hr class="my-4">

                    <div class="text-end">
                        <button type="submit" class="btn btn-primary px-5 py-2 fw-bold rounded-pill">Save
                            Changes</button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- App JS -->
    <script src="/static/js/app.js"></script>
</body>

</html>
