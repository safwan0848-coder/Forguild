<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Forguild</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top border-bottom">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-hexagon-fill text-violet me-2"></i>Event<span>Hub</span>
            </a>
            <a class="btn btn-outline-primary ms-auto" href="login.html">Sign In</a>
        </div>
    </nav>

    <!-- Register Form -->
    <section class="py-5">
        <div class="container d-flex justify-content-center align-items-center min-vh-75 mt-3">
            <div class="card shadow-lg border-0 w-100" style="max-width: 500px;">
                <div class="card-body p-5">
                    <h2 class="text-center fw-bold mb-4">Create Account</h2>
                    <form onsubmit="event.preventDefault(); window.location.href='dashboard.html'">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted">First Name</label>
                                <input type="text" class="form-control" placeholder="John" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted">Last Name</label>
                                <input type="text" class="form-control" placeholder="Doe" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted">Email address</label>
                            <input type="email" class="form-control" placeholder="name@example.com" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted">Password</label>
                            <input type="password" class="form-control" placeholder="Min 8 characters" required>
                        </div>
                        <button type="submit" class="btn btn-gold w-100 py-2 fw-bold rounded-pill mb-3">Sign Up
                            Free</button>

                        <div class="text-center text-muted small mt-3">
                            By creating an account, you agree to our <a href="#" class="text-violet">Terms</a> and <a
                                href="#" class="text-violet">Privacy Policy</a>
                        </div>

                        <div class="text-center text-muted small mt-4">
                            Already have an account? <a href="login.html"
                                class="fw-bold text-violet text-decoration-none">Sign In</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
