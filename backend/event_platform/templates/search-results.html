<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results - Forguild</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Auth Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top border-bottom">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="dashboard.html">
                <i class="bi bi-hexagon-fill text-violet me-2"></i>Event<span>Hub</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarDash">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarDash">
                <form class="d-flex mx-auto col-md-5 my-2 my-lg-0">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i
                                class="bi bi-search text-muted"></i></span>
                        <input class="form-control border-start-0 ps-0" type="search" value="AI Hackathon"
                            aria-label="Search">
                    </div>
                </form>

                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                    <li class="nav-item me-3 position-relative">
                        <a class="nav-link fs-5 text-dark" href="messages.html">
                            <i class="bi bi-chat-dots"></i>
                        </a>
                    </li>
                    <li class="nav-item me-4 position-relative">
                        <a class="nav-link fs-5 text-dark" href="notifications.html">
                            <i class="bi bi-bell"></i>
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="navbarDropdown"
                            role="button" data-bs-toggle="dropdown">
                            <img src="https://ui-avatars.com/api/?name=John+Doe&background=8A2BE2&color=fff"
                                alt="Profile" class="rounded-circle me-2" width="32" height="32">
                            <span class="d-none d-md-inline text-dark fw-bold">John Doe</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end border-0 shadow-sm">
                            <li><a class="dropdown-item" href="dashboard.html"><i class="bi bi-grid-1x2 me-2"></i>
                                    Dashboard</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item text-danger" href="index.html"><i
                                        class="bi bi-box-arrow-right me-2"></i> Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Layout -->
    <div class="container py-5 flex-grow-1">

        <div class="mb-5">
            <h2 class="fw-bold">Search Results</h2>
            <p class="text-muted">Showing results for <span class="fw-bold text-dark">"AI Hackathon"</span></p>
        </div>

        <ul class="nav nav-pills mb-4" id="pills-tab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active bg-white text-dark border me-2" data-bs-toggle="pill"
                    data-bs-target="#pills-events">Events <span class="badge bg-secondary ms-1">1</span></button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link bg-white text-dark border me-2" data-bs-toggle="pill"
                    data-bs-target="#pills-teams">Teams <span class="badge bg-secondary ms-1">1</span></button>
            </li>
        </ul>

        <div class="tab-content" id="pills-tabContent">
            <!-- Events Tab -->
            <div class="tab-pane fade show active" id="pills-events">
                <div class="row">
                    <div class="col-md-6 col-lg-4 mb-4">
                        <div class="card h-100 shadow-sm">
                            <img src="https://images.unsplash.com/photo-1488590528505-98d2b5aba04b?auto=format&fit=crop&w=600&q=80"
                                class="card-img-top" alt="Global AI Hackathon"
                                style="height: 200px; object-fit: cover;">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <span class="badge badge-violet rounded-pill">AI</span>
                                    <button class="btn btn-sm btn-light save-evt-btn" title="Save Event">
                                        <i class="bi bi-bookmark fs-5"></i>
                                    </button>
                                </div>
                                <h5 class="card-title text-truncate">Global AI Hackathon 2026</h5>
                                <p class="card-text text-muted small mb-1">
                                    <i class="bi bi-calendar3 me-1 text-violet"></i> April 15-17, 2026
                                </p>
                                <p class="card-text text-muted small mb-3">
                                    <i class="bi bi-geo-alt me-1 text-violet"></i> Online
                                </p>
                                <div class="d-flex justify-content-between align-items-center mt-auto">
                                    <span class="small fw-bold text-gold"><i class="bi bi-trophy me-1"></i>
                                        $50,000</span>
                                    <a href="event-details.html" class="btn btn-sm btn-outline-primary">View</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Teams Tab -->
            <div class="tab-pane fade" id="pills-teams">
                <div class="row">
                    <div class="col-md-6 mb-4">
                        <div class="card shadow-sm border-0">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start border-bottom pb-2 mb-3">
                                    <div>
                                        <h5 class="card-title mb-1">Neural Ninjas</h5>
                                        <p class="small text-muted mb-0">For: Global <mark
                                                class="bg-warning text-dark p-0 px-1 rounded">AI Hackathon</mark> 2026
                                        </p>
                                    </div>
                                    <span class="badge bg-light text-dark border">2/4 Members</span>
                                </div>
                                <p class="small fw-bold mb-1">Looking for:</p>
                                <div class="mb-3">
                                    <span class="badge badge-gold me-1">Frontend</span>
                                    <span class="badge badge-gold me-1">UX Designer</span>
                                </div>
                                <a href="team-details.html" class="btn btn-sm btn-outline-primary w-100">View Team</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Fix active pills coloring visually
        document.querySelectorAll('.nav-pills .nav-link').forEach(link => {
            link.addEventListener('click', function () {
                document.querySelectorAll('.nav-pills .nav-link').forEach(l => {
                    l.classList.remove('bg-primary', 'text-white', 'border-primary');
                    l.classList.add('bg-white', 'text-dark', 'border');
                });
                this.classList.remove('bg-white', 'text-dark', 'border');
                this.classList.add('bg-primary', 'text-white', 'border-primary');
            });
        });
        // Initial set
        document.querySelector('.nav-pills .nav-link.active').classList.remove('bg-white', 'text-dark', 'border');
        document.querySelector('.nav-pills .nav-link.active').classList.add('bg-primary', 'text-white', 'border-primary');
    </script>
</body>

</html>
