<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Forguild</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top border-bottom">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-hexagon-fill text-violet me-2"></i>Event<span>Hub</span>
            </a>
            <a class="btn btn-outline-primary ms-auto" href="register.html">Sign Up</a>
        </div>
    </nav>

    <!-- Login Form -->
    <section class="py-5">
        <div class="container d-flex justify-content-center align-items-center min-vh-75 mt-5">
            <div class="card shadow-lg border-0 w-100" style="max-width: 450px;">
                <div class="card-body p-5">
                    <h2 class="text-center fw-bold mb-4">Welcome Back</h2>
                    <form onsubmit="event.preventDefault(); window.location.href='dashboard.html'">
                        <div class="mb-3">
                            <label for="email" class="form-label text-muted">Email address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i
                                        class="bi bi-envelope text-violet"></i></span>
                                <input type="email" class="form-control border-start-0 ps-0" id="email"
                                    placeholder="name@example.com" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <div class="d-flex justify-content-between">
                                <label for="password" class="form-label text-muted">Password</label>
                                <a href="#" class="small text-decoration-none text-gold">Forgot password?</a>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i
                                        class="bi bi-lock text-violet"></i></span>
                                <input type="password" class="form-control border-start-0 ps-0" id="password"
                                    placeholder="••••••••" required>
                            </div>
                        </div>
                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" id="rememberMe">
                            <label class="form-check-label text-muted small" for="rememberMe">Remember me to stay logged
                                in</label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-pill mb-3">Sign
                            In</button>

                        <div class="text-center text-muted small">
                            Don't have an account? <a href="register.html"
                                class="fw-bold text-violet text-decoration-none">Sign Up</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
